[workspace]
resolver = "2"
members = [
    "crates/ogar-vocab",
    "crates/ogar-ontology",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/OGAR"
authors = ["AdaWorldAPI"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
