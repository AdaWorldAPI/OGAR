name: Weather review docs

on:
  push:
    branches:
      - codex/weather-classid-mint-271

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/weather-classid-mint-271
          fetch-depth: 0
      - name: Apply review fixes
        run: python .github/scripts/weather_review_docs.py
      - name: Commit review fixes and remove bootstrap
        run: |
          git rm .github/workflows/weather-review-docs.yml .github/scripts/weather_review_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ogar-vocab/src/lib.rs docs/APP-CLASS-CODEBOOK-LAYOUT.md
          git commit -m "docs(vocab): align Weather domain allocation"
          git push origin HEAD:codex/weather-classid-mint-271
