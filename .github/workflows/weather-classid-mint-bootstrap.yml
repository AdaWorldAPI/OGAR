name: Weather classid mint bootstrap

on:
  push:
    branches:
      - codex/weather-classid-mint-271

permissions:
  contents: write

jobs:
  mint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/weather-classid-mint-271
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply append-only weather authority
        run: python .github/scripts/weather_classid_mint.py
      - name: Format and test the mint
        run: |
          cargo fmt --all
          cargo test -p ogar-vocab
          cargo clippy -p ogar-vocab --all-targets -- -D warnings
      - name: Commit tested mint and remove bootstrap
        run: |
          git rm .github/workflows/weather-classid-mint-bootstrap.yml .github/scripts/weather_classid_mint.py .claude/weather-mint-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ogar-vocab/src/lib.rs crates/ogar-vocab/src/ports.rs docs/APP-CLASS-CODEBOOK-LAYOUT.md
          git commit -m "feat(vocab): mint Weather/Atmosphere classids (#271)"
          git push origin HEAD:codex/weather-classid-mint-271
