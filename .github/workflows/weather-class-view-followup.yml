name: Weather ClassView follow-up

on:
  push:
    branches:
      - codex/weather-classid-mint-271

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/weather-classid-mint-271
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply ClassView mirror
        run: python .github/scripts/weather_class_view_followup.py
      - name: Prove the affected package
        run: |
          cargo fmt --all
          cargo test -p ogar-class-view
      - name: Commit tested follow-up and remove bootstrap
        run: |
          git rm .github/workflows/weather-class-view-followup.yml .github/scripts/weather_class_view_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ogar-class-view/src/lib.rs
          git commit -m "fix(class-view): mirror Weather canonical concepts"
          git push origin HEAD:codex/weather-classid-mint-271
