[package]
name = "ogar-from-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Schema-as-input producer family for OGAR IR. Lifts the STRUCTURAL ARM of a domain from declarative schemas (OGIT TTL today; XSD/JSON-Schema/OpenAPI/Prisma queued) into ogar-vocab Class/Attribute/Association/EnumSource without parsing source code. Pair with source-AST producers (ogar-from-rails, ogar-from-elixir) which carry the BEHAVIORAL arm — see docs/HIRO-IN-CLASSES.md §2 'Schema lifts structure; source lifts behavior'."

[features]
default = []
serde = ["dep:serde", "ogar-vocab/serde"]
# The `xsd` feature pulls in a read-only XML parser for the XSD
# front-end (the faithful Rust transcode of arago/MARS-Schema's
# extract_classes.py). Kept optional so the default TTL path stays
# zero-parser-deps.
xsd = ["dep:roxmltree"]

[dependencies]
ogar-vocab = { path = "../ogar-vocab" }
serde = { workspace = true, optional = true }
roxmltree = { version = "0.20", optional = true }

# The default TTL reader uses a narrow line-oriented walker that
# handles the shapes OGIT's TTL actually emits (a tiny, machine-stable
# subset of full Turtle) — no external parser. The `xsd` feature adds
# roxmltree (pure-Rust, read-only DOM) ONLY for the XSD front-end.
# When the TTL surface grows (Wikidata-shaped TTL, full RDF/XML, OWL
# imports), swap in `oxttl` / `oxrdf` without touching the
# Class/Attribute target shape this crate produces.

[dev-dependencies]
# Used only by tests/do_arm_emit.rs to prove the DO-arm lift's output
# (`ogar_vocab::ActionDef`) flows through the canonical SPO emitter
# end-to-end. Acyclic: ogar-emitter depends on ogar-vocab/-ontology,
# never on this crate.
ogar-emitter = { path = "../ogar-emitter" }
