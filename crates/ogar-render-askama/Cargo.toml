[package]
name = "ogar-render-askama"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build-time askama codegen harness over the canonical layer — one `ArtifactKind` enum dispatching `ogar_vocab::Class` to per-kind askama templates (Rust struct, TS interface, SurrealQL TABLE, OpenAPI schema, …). Structurally mirrors AdaWorldAPI/woa-rs `codegen` crate (RFC-v02-006: spec + HandlerKind + per-kind template); the canonical input is `Class` here instead of `RouteSpec`."

[dependencies]
ogar-vocab = { path = "../ogar-vocab" }
# FLOAT: branch = "main" → PR branch until lance-graph #776 merges (flip back to main then).
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "claude/ogar-docir-architecture-jjzlig" }
askama = "0.12"

[dev-dependencies]
# harvest driver for examples/render_osm.rs (Rails app/models → Class → Rust)
ogar-from-rails = { path = "../ogar-from-rails" }
# shared (fields, mask) fixture for the askama<->jinja dual-target
# round-trip (tests/mask_dual_target.rs + tests/jinja/test_mask_roundtrip.py)
serde = { workspace = true }
serde_json = "1.0"
