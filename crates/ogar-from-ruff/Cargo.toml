[package]
name = "ogar-from-ruff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Lift `ruff_spo_triplet::Model` (the language-agnostic IR populated by ruff frontends like `ruff_ruby_spo`) into `ogar_vocab::Class`. Mechanical field-by-field projection — the ruff IR was deliberately shaped to mirror ogar-vocab. This crate is the producer-side seam between ruff's parser ecosystem and OGAR's canonical vocab; thin enough to also serve as the reference implementation for other `ogar-from-<lang>` crates that go through ruff."

[features]
default = []
serde = ["dep:serde", "ogar-vocab/serde"]

[dependencies]
ogar-vocab = { path = "../ogar-vocab" }
# ruff pinned to an exact rev (not floating `branch = "main"`): this crate
# reads `ruff_spo_triplet::Model::inherits` (ruff PR #40) and the DO-arm
# controller harvest reads `ruff_ruby_spo::extract_tree_with` (added on the
# medcare-bridge branch, rev `45b6e62`). With no committed Cargo.lock a floating
# branch could resolve to a rev WITHOUT those and fail to compile. Both ruff
# crates MUST share one rev (they depend on ruff_spo_triplet internally; a
# mismatch double-checks-out ruff). Bump in lockstep with ogar-from-rails.
ruff_spo_triplet = { git = "https://github.com/AdaWorldAPI/ruff", rev = "45b6e62e397528a88683376596256f9a435c1946" }
ruff_spo_address = { git = "https://github.com/AdaWorldAPI/ruff", rev = "45b6e62e397528a88683376596256f9a435c1946" }
serde = { workspace = true, optional = true }
