[package]
name = "ogar-adapter-surrealql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "DEPRECATED (2026-07-22, SoC ruling): OGAR does not delegate its AST/IR concern to SurrealQL's AST (DLL) API — even if functional it is a separation-of-concerns error. DO arm = ActionDef via ogar-render-askama, spine = compiled ClassView (V3). See docs/DISCOVERY-MAP.md D-SURREALQL-DEPRECATED. [Historical: bidirectional SurrealQL DDL bridge — emit(Class) -> DDL, unmap(DDL) -> Class.]"

[features]
default = []
serde = ["dep:serde", "ogar-vocab/serde"]
# Enables the surrealdb-parser + surrealdb-ast deps from the workspace
# (git ref AdaWorldAPI/surrealdb#main). Activated by the rust-version 1.95
# bump in PR #23 — the deps require rust-version 1.95+.
surrealdb-parser = ["dep:surrealdb-ast", "dep:surrealdb-parser"]

[dependencies]
ogar-vocab = { path = "../ogar-vocab" }
serde = { workspace = true, optional = true }
# Wired under the `surrealdb-parser` feature; canonical fork ref pinned in
# the workspace `[workspace.dependencies]` block (PR #23). Internal-API
# surfaces — pinned to a specific commit/branch, not crates.io semver.
surrealdb-ast    = { workspace = true, optional = true }
surrealdb-parser = { workspace = true, optional = true }
