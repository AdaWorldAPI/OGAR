[package]
name = "ogar-oidc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-agnostic OIDC ID-token verifier for ogar-auth: implements `AssertionVerifier` over compact JWS ID tokens (ES256, EdDSA; RS256 behind the opt-in `rs256` feature) against per-issuer JWKS the caller supplies. No network I/O, no provider-specific claims."

[dependencies]
ogar-auth = { path = "../ogar-auth" }
# Ed25519 verification — reused from OGAR's encryption surface, never re-implemented.
ogar-encryption = { path = "../ogar-encryption" }
# ES256 (P-256 ECDSA). AdaWorldAPI fork of RustCrypto/elliptic-curves, the rev the
# ndarray `encryption` crate already pins for x448. `ecdsa` itself is redirected to
# the AdaWorldAPI/signatures fork by the workspace `[patch.crates-io]`.
p256 = { git = "https://github.com/AdaWorldAPI/elliptic-curves", branch = "master", default-features = false, features = ["ecdsa", "alloc"] }
base64 = "0.22"
serde_json = "1"
# RS256 (RSASSA-PKCS1-v1_5 / SHA-256), opt-in via the `rs256` feature. AdaWorldAPI fork,
# floating on its default branch; never the crates.io `rsa`. `pkcs1v15` is the fork's
# opt-in gate for PKCS#1 v1.5 (verification only is used here); no default features.
rsa = { git = "https://github.com/AdaWorldAPI/RSA", branch = "master", default-features = false, features = ["pkcs1v15"], optional = true }

[features]
default = []
rs256 = ["dep:rsa"]

[dev-dependencies]
# Test-only RSA key generation and signing (needs the OS RNG); not part of the library build.
rsa = { git = "https://github.com/AdaWorldAPI/RSA", branch = "master", features = ["pkcs1v15"] }
rand = "0.10"
