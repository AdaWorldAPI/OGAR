[package]
name = "ogar-r2il"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Proxy glue: r2sleigh's R2IL opcode set as an ogar-loco Vocabulary, plus the masked lane projection that re-reads one body under any LaneShape without rebuilding it. Always-on — no feature gate, no optional dep."

[dependencies]
ogar-loco = { path = "../ogar-loco" }

[dev-dependencies]
# PROBE-ZIPPER-HOP-PARITY only (tests/zipper_hop_parity.rs): the real facet
# carrier for the rail zipper. Dev-only — the lib keeps its ogar-loco-only
# dependency surface (the "no r2sleigh dep" reasoning applies here too:
# tests may hold the object graph, the vocabulary table must not).
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
