[package]
name = "ogar-action-handler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "OGAR-native HIRO ActionHandler runtime — CapabilityExecutor impls (the B1 executor seam) over the action-ws protocol core in ogar-from-schema. The reference NativeCommandExecutor runs a capability's command via a local process; SSH/REST targets follow the same trait. rs-graph-llm's graph-flow-action provides the production executors. Also holds the OGIT tables HIRO validates against and, behind `ontology-cache`, the Ontology cache loader and, behind `quack`, the Quack binder over those tables."

[features]
default = []
# The Ontology cache: lance-graph-ontology's OntologyRegistry, loaded from an
# OGIT tree (`ogit::load_registry`). Off by default, because it brings
# lance-graph by git, which path-based consumers such as rs-graph-llm's
# graph-flow-action-ogar do not need.
ontology-cache = ["dep:lance-graph-ontology"]
# The Quack binder over the OGIT tables (`ogit::OgitBinder`). Off by default for
# the same reason as `ontology-cache`. mask-risc is the executor the bound
# queries run on; the tests execute them, and its types appear beside Quack's
# in any consumer that does the same.
quack = ["dep:lance-graph-quack", "dep:lance-graph-mask-risc"]
# The DT64 converter (`dt64`): registers a domain table's ActionDefs as the
# methods of lance-graph-dt64's `BindStore`. Off by default for the same
# reason as `ontology-cache`: it brings lance-graph by git.
dt64 = ["dep:lance-graph-dt64", "dep:lance-graph-contract"]

# The KI-1 falsifier (`tests/ki1_three_valued_when.rs`): pins that r2il's
# MethodBinding seam refuses a three-valued (Kleene) WHEN, beside a scalar
# oracle of the acceptance truth table. A feature, not a dev-dependency, so the
# default build and `--features dt64` never fetch lance-graph-r2il.
ki1 = ["dt64", "quack", "dep:lance-graph-r2il", "dep:ogar-r2il"]

[[example]]
name = "ogit_validator_bench"
required-features = ["quack"]

[[test]]
name = "ki1_three_valued_when"
required-features = ["ki1"]

[dependencies]
ogar-from-schema = { path = "../ogar-from-schema", features = ["serde"] }
ogar-vocab = { path = "../ogar-vocab" }
# The runtime owns I/O: it reads the REST Action API registration response
# (`GET /capabilities`), so it carries the JSON reader. The producer crate
# (`ogar-from-schema`) stays parser-free — it defines the `Deserialize` DTOs +
# the pure lift; this crate does the `from_str`. (B2-lift.)
serde_json = "1.0"
lance-graph-ontology = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
lance-graph-quack = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
lance-graph-mask-risc = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
lance-graph-dt64 = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
lance-graph-r2il = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main", optional = true }
# Only for the concept half of the R2IL fold lens (`CONCEPT_R2IL_FOLD`).
ogar-r2il = { path = "../ogar-r2il", optional = true }

[dev-dependencies]
# The ClassView the `dt64` tests resolve fields through (OGAR's promoted
# canonical concepts). A path crate; it takes lance-graph-contract from the
# same git source as above, so the tree holds one contract.
ogar-class-view = { path = "../ogar-class-view" }
# Execution probe only: drives the executor from a *lifted* ActionDef
# (harvest arm) rather than a hand-written capability, so the probe
# witnesses lift -> dispatch. Not a runtime dependency of this crate.
ogar-from-ruff = { path = "../ogar-from-ruff" }
# On ruff `main` (O-2 de-pin done 2026-07-06); keep in lockstep with ogar-from-ruff.
ruff_spo_triplet = { git = "https://github.com/AdaWorldAPI/ruff", branch = "main" }
# DR64 relation composition (relcomp), for the lab probe
# `tests/ogit_schema_composition.rs`. Test-only.
dr-math-binding-probe = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
