[package]
name = "ogar-obo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "OBO-core reference bake — MONDO (disease) · HPO (phenotype) · Uberon (anatomy) · PATO (quality) · RO (relations) parsed to a canon 512-byte SoA NodeRow buffer (key|edges|value LE) the lance-graph loader reads zero-copy, plus the OWL-EL completion subset (is_a saturation + transitive-role existential propagation) the OBO EL profile actually exercises. Pure public CC-BY reference; never PHI."

[features]
default = []
serde = ["dep:serde"]
# RDF front-end. Off by default so the crate keeps its "deps: ogar-vocab only"
# lean profile; the three ox* crates are pure Rust (no C, no build script) and
# are pinned to the SAME versions lance-graph-ontology pins, so a workspace
# that builds both resolves one copy of oxrdf.
rdf = ["dep:oxrdf", "dep:oxrdfxml", "dep:oxttl"]

[dependencies]
ogar-vocab = { path = "../ogar-vocab" }
serde = { workspace = true, optional = true }
oxrdf = { version = "0.3", optional = true }
oxrdfxml = { version = "0.2", optional = true }
oxttl = { version = "0.2", optional = true }

[dev-dependencies]
